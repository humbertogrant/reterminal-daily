sonnets:
  - slug: garcilaso_v
    title: "Soneto V"
    author: "Garcilaso de la Vega"
    lines:
      - "Escrito está en mi alma vuestro gesto,"
      - "y cuanto yo escribir de vos deseo;"
      - "vos sola lo escribisteis; yo lo leo"
      - "tan solo, que aun de vos me guardo en esto."
      - "En esto estoy y estaré siempre puesto;"
      - "que aunque no cabe en mí cuanto en vos veo,"
      - "de tanto bien lo que no entiendo creo,"
      - "tomando ya la fe por presupuesto."
      - "Yo no nací sino para quereros;"
      - "mi alma os ha cortado a su medida;"
      - "por hábito del alma misma os quiero."
      - "Cuanto tengo confieso yo deberos;"
      - "por vos nací, por vos tengo la vida,"
      - "por vos he de morir, y por vos muero."
    comment: "La forma cerrada del soneto contiene una declaración absoluta: medida, deuda y destino convergen en una sola persona."

  - slug: quevedo_amor
    title: "Amor constante más allá de la muerte"
    author: "Francisco de Quevedo"
    lines:
      - "Cerrar podrá mis ojos la postrera"
      - "sombra que me llevare el blanco día,"
      - "y podrá desatar esta alma mía"
      - "hora a su afán ansioso lisonjera;"
      - "mas no, de esotra parte, en la ribera,"
      - "dejará la memoria, en donde ardía:"
      - "nadar sabe mi llama la agua fría,"
      - "y perder el respeto a ley severa."
      - "Alma a quien todo un dios prisión ha sido,"
      - "venas que humor a tanto fuego han dado,"
      - "médulas que han gloriosamente ardido,"
      - "su cuerpo dejará, no su cuidado;"
      - "serán ceniza, mas tendrá sentido;"
      - "polvo serán, mas polvo enamorado."
    comment: "Quevedo enfrenta la ley física de la muerte con una memoria que pretende sobrevivirla: materia extinguida, significado intacto."

  - slug: lope_ausencia
    title: "Ir y quedarse"
    author: "Lope de Vega"
    lines:
      - "Ir y quedarse, y con quedar partirse,"
      - "partir sin alma, e ir con alma ajena,"
      - "oír la dulce voz de una sirena"
      - "y no poder del árbol desasirse;"
      - "arder como la vela y consumirse,"
      - "haciendo torres sobre tierna arena;"
      - "caer de un cielo, y ser demonio en pena,"
      - "y de serlo jamás arrepentirse;"
      - "hablar entre las mudas soledades,"
      - "pedir prestada, sobre fe, paciencia,"
      - "y lo que es temporal llamar eterno;"
      - "creer sospechas y negar verdades,"
      - "es lo que llaman en el mundo ausencia,"
      - "fuego en el alma y en la vida infierno."
    comment: "La ausencia aparece como una colección de contradicciones: quedarse y partir, creer y negar, temporal y eterno."
