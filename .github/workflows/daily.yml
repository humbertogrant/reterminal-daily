name: E1001 daily

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "10 12 * * *" # 06:10 America/Costa_Rica

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: e1001-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Cairo + Japanese font runtime
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 fonts-noto-cjk

      - name: Verify Japanese font
        run: fc-match "Noto Sans CJK JP" | grep -qi "NotoSansCJK"

      - name: Install dependencies
        run: pip install "beautifulsoup4>=4.12,<5" "cairosvg>=2.7,<3" "Pillow>=10,<12" "PyYAML>=6,<7" "requests>=2.32,<3" "exchange-calendars>=4.11,<5" "tzdata>=2025.2"

      - name: Regression tests
        run: python -m unittest discover -s tests -v

      - name: Retrieve
        run: python src/retrieve.py

      - name: Validate
        run: python src/validate.py

      - name: Render production edition
        run: python src/render.py

      - name: Render forced Japanese test
        run: python src/render.py --education-mode japanese --output-prefix japanese_test

      - name: Acceptance
        run: python src/acceptance.py

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e1001-${{ github.run_id }}
          path: |
            output/latest.png
            output/latest.svg
            output/japanese_test.png
            output/japanese_test.svg
            output/latest_manifest.json
            output/validated.json
            output/raw.json
          retention-days: 30

      - name: Build Pages bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp output/latest.png site/latest.png
          cp output/latest.svg site/latest.svg
          cp output/latest_manifest.json site/latest_manifest.json
          cp output/validated.json site/validated.json

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
            <title>reTerminal E1001 daily</title>
            <style>
              body {
                font-family: Arial, Helvetica, sans-serif;
                margin: 24px;
                max-width: 900px;
              }
              img {
                width: 800px;
                max-width: 100%;
                height: auto;
                border: 1px solid #bbb;
              }
              code {
                background: #f2f2f2;
                padding: 2px 4px;
              }
            </style>
          </head>
          <body>
            <h1>reTerminal E1001 daily</h1>
            <p>Última edición validada y publicada por GitHub Actions.</p>
            <p>
              <a href="./latest.png">latest.png</a> ·
              <a href="./latest_manifest.json">manifest</a> ·
              <a href="./validated.json">validated.json</a>
            </p>
            <img src="./latest.png" alt="Última edición del reTerminal E1001">
          </body>
          </html>
          HTML

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
